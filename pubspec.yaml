name: eco_connect
description: EcoConnect mobile application with authentication, email service, and GPS tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.4.4
  connectivity_plus: ^6.1.4
  path: ^1.9.0

  # Location services
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Map display
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^12.1.3

  # UI
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
