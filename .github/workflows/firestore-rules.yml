# Runs the Firestore security rules tests on the emulator whenever the rules
# or their tests change.
name: Firestore rules tests

on:
  push:
    paths:
      - firestore.rules
      - firestore-tests/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firestore-tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # demo- project IDs run fully offline, no Firebase login needed.
      - run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-ecoconnect --only firestore "npm test"
