server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web needs the right MIME types for wasm/js assets.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;
    gzip_min_length 1024;

    # go_router uses client-side routing: unknown paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point or the service worker, otherwise browsers
    # keep serving a stale app after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Everything else is content-hashed by the Flutter build, so cache it hard.
    location ~* \.(js|json|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
